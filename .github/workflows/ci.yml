name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t techpulse:ci .
      - name: Smoke test (offline fixture mode)
        run: |
          docker run -d --name tp -p 8000:8000 \
            -e SCRAPER_SOURCE=fixture -e SCHEDULE_ENABLED=false techpulse:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/runs
          sleep 10
          curl -fs localhost:8000/api/stats | tee stats.json
          python -c "import json; s=json.load(open('stats.json')); assert s['total_stories']==30, s"
      - if: always()
        run: docker logs tp || true
