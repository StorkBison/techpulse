# Vercel Hobby cron runs at most once a day; this workflow calls the same secured
# endpoint more often. Needs repo secrets TECHPULSE_URL and CRON_SECRET (skips otherwise).
name: Scheduled pipeline run

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron
        env:
          URL: ${{ secrets.TECHPULSE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "TECHPULSE_URL / CRON_SECRET not set - skipping"; exit 0
          fi
          curl -fsS --max-time 240 -H "Authorization: Bearer $SECRET" "$URL/api/cron"
