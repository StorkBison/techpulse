services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techpulse
      POSTGRES_PASSWORD: techpulse
      POSTGRES_DB: techpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techpulse"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://techpulse:techpulse@db:5432/techpulse
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
