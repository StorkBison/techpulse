[project]
name = "techpulse"
version = "1.0.0"
description = "AI-curated tech news monitor: Playwright scraping -> Claude enrichment -> PostgreSQL -> alerts + dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=2.0",
    "playwright>=1.45",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
video = ["imageio-ffmpeg>=0.5", "edge-tts>=6.1"]

[project.scripts]
techpulse = "techpulse.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["techpulse*"]

[tool.setuptools.package-data]
techpulse = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: needs a Playwright Chromium install"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"demo/record_demo.py" = ["E501"]  # embedded JS overlay + narration strings
